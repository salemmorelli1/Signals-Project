name: Validate joint torus SSM and WiSig adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-ci-lock.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m mypy src scripts
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts tests
      - run: >-
          python -m src.signals_project.joint_ssm
          --output /tmp/signals-smoke
          --repetitions 2
          --particles 24
          --samples 24
      - run: python scripts/analyze_joint_results.py
      - run: python scripts/build_site.py
      - run: python scripts/build_report.py
      - run: python scripts/validate_repository.py
      - run: git diff --check
      - run: git diff --exit-code
